# CI only — tests, frontend build, optional image push to GHCR.
# No CD / auto-deploy (deferred until a host is chosen).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-auth-service
          - community-service
          - post-service
          - comment-service
          - vote-service
          - media-service
          - audit-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B -DskipITs test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install
        working-directory: services/frontend
        run: npm ci
      - name: Lint
        working-directory: services/frontend
        run: npm run lint
        continue-on-error: true
      - name: Build
        working-directory: services/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  docker-build:
    name: Docker build (and push on main)
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: services/api-gateway
            image: api-gateway
          - context: services/user-auth-service
            image: user-auth-service
          - context: services/community-service
            image: community-service
          - context: services/post-service
            image: post-service
          - context: services/comment-service
            image: comment-service
          - context: services/vote-service
            image: vote-service
          - context: services/media-service
            image: media-service
          - context: services/audit-service
            image: audit-service
          - context: services/notification-service
            image: notification-service
          - context: services/frontend
            image: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/threadly-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (PR) or build+push (main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
