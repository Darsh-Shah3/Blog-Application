# Production-like surface: merge with the base compose file.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Publishes only frontend (:3000) and api-gateway (:8080) to the host.
# Internal service ports use Compose Spec `ports: !override []` so they replace
# (not append) the base file's host bindings. Requires Docker Compose v2.24+
# (Compose Spec merge reset/override tags).

services:
  redis:
    ports: !override []

  postgres:
    ports: !override []

  pgadmin:
    ports: !override []

  user-auth-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # First boot on an empty auth DB: temporarily set BOOTSTRAP_ADMIN_ENABLED=true
      # (or override via env) so the platform admin is created, then set false again.
      BOOTSTRAP_ADMIN_ENABLED: "false"
      REDIS_ENABLED: "true"
      CACHE_REDIS_ENABLED: "true"
      TOKEN_BLACKLIST_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-threadly_redis}

  community-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REDIS_ENABLED: "true"
      CACHE_REDIS_ENABLED: "true"
      TOKEN_BLACKLIST_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-threadly_redis}

  post-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_ENABLED: "true"
      CACHE_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-threadly_redis}

  comment-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod

  vote-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod

  media-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod

  audit-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod

  notification-service:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_ENABLED: "true"
      CACHE_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-threadly_redis}

  api-gateway:
    # Keep host publish :8080 from base compose.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RATE_LIMIT_REDIS_ENABLED: "true"
      REDIS_ENABLED: "true"
      TOKEN_BLACKLIST_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-threadly_redis}

  # frontend: keep host publish :3000 from base compose (no override).

  prometheus:
    ports: !override []

  grafana:
    ports: !override []
