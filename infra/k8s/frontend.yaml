apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: threadly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: app
          image: threadly/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Browser calls this URL — for Kind + Ingress use the host you set in ingress.yaml
            # Browser origin through Ingress host (see docs/kubernetes.md)
            - name: NEXT_PUBLIC_API_URL
              value: "http://threadly.local"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: threadly
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
