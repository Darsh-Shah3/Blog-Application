# Domain microservices (1 replica each). Images: threadly/<name>:local (Kind load).
# Shared env from ConfigMap + Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: threadly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-auth-service
  template:
    metadata:
      labels:
        app: user-auth-service
    spec:
      containers:
        - name: app
          image: threadly/user-auth-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: threadly-config
            - secretRef:
                name: threadly-secrets
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: POSTGRES_DB
              value: auth_db
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-auth-service
  namespace: threadly
spec:
  selector:
    app: user-auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
