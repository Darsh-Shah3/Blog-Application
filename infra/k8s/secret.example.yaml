# Copy to secret.yaml (gitignored) or create with:
#   kubectl -n threadly create secret generic threadly-secrets \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=INTERNAL_API_KEY=... \
#     --from-literal=REDIS_PASSWORD=...
#
# DO NOT commit real secret.yaml with production values.
apiVersion: v1
kind: Secret
metadata:
  name: threadly-secrets
  namespace: threadly
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_DB_PASSWORD"
  JWT_SECRET: "CHANGE_ME_LONG_RANDOM_JWT_SECRET_AT_LEAST_32_CHARS"
  INTERNAL_API_KEY: "CHANGE_ME_INTERNAL_SERVICE_KEY"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
