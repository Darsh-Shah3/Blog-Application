apiVersion: v1
kind: ConfigMap
metadata:
  name: threadly-config
  namespace: threadly
data:
  SPRING_PROFILES_ACTIVE: "prod"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REDIS_ENABLED: "true"
  RATE_LIMIT_RPM: "120"
  RATE_LIMIT_AUTH_RPM: "20"
  REDIS_ENABLED: "true"
  CACHE_REDIS_ENABLED: "true"
  TOKEN_BLACKLIST_ENABLED: "true"
  REQUIRE_JWT_FOR_ALL_APIS: "true"
  BOOTSTRAP_ADMIN_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
  FRONTEND_BASE_URL: "http://localhost:3000"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "threadly"
  AUTH_SERVICE_URL: "http://user-auth-service:8081"
  COMMUNITY_SERVICE_URL: "http://community-service:8082"
  POST_SERVICE_URL: "http://post-service:8083"
  COMMENT_SERVICE_URL: "http://comment-service:8084"
  VOTE_SERVICE_URL: "http://vote-service:8085"
  MEDIA_SERVICE_URL: "http://media-service:8086"
  AUDIT_SERVICE_URL: "http://audit-service:8087"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8088"
  MEDIA_UPLOAD_DIR: "/app/uploads"
  MEDIA_STORAGE: "local"
