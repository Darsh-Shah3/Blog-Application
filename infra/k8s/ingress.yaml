# Ingress = edge load balancer / reverse proxy into the cluster.
# Requires an Ingress controller (e.g. ingress-nginx on Kind).
#
# Paths:
#   /           → frontend
#   /api        → api-gateway (preserve path)
#   /ws         → api-gateway (WebSockets)
#   /actuator   → api-gateway health (optional)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threadly
  namespace: threadly
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway"
spec:
  ingressClassName: nginx
  rules:
    - host: threadly.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
