server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:audit_db}
    username: ${POSTGRES_USER:threadly}
    password: ${POSTGRES_PASSWORD:threadly_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET:ThR3@dly-Jwt-Hs256-Secret-Key-2026-Industry-Grade-9f3c8a2b7e1d}
  internal-api-key: ${INTERNAL_API_KEY:threadly-internal-dev-key}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:180}
  services:
    auth-base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    post-base-url: ${POST_SERVICE_URL:http://localhost:8083}
    community-base-url: ${COMMUNITY_SERVICE_URL:http://localhost:8082}
    comment-base-url: ${COMMENT_SERVICE_URL:http://localhost:8084}

logging:
  level:
    root: INFO
    com.threadly: DEBUG
