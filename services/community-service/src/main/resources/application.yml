server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: community-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:community_db}
    username: ${POSTGRES_USER:threadly}
    password: ${POSTGRES_PASSWORD:threadly_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET:ThR3@dly-Jwt-Hs256-Secret-Key-2026-Industry-Grade-9f3c8a2b7e1d}
  redis:
    enabled: ${REDIS_ENABLED:false}
  token-blacklist:
    enabled: ${TOKEN_BLACKLIST_ENABLED:${REDIS_ENABLED:false}}
  cache:
    redis-enabled: ${CACHE_REDIS_ENABLED:${REDIS_ENABLED:false}}
  internal-api-key: ${INTERNAL_API_KEY:threadly-internal-dev-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:180}
  services:
    notification-base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}

logging:
  level:
    root: INFO
    com.threadly: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [service=${spring.application.name},requestId=%X{requestId:-},userId=%X{userId:-}] - %msg%n"
